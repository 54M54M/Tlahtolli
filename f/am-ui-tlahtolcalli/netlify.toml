[build]
  command = "npm run build"
  publish = "dist"
  base = "f/am-ui-tlahtolcalli"

# Las páginas públicas (/, /como-se-usa, /novedades, /privacidad, /terminos) existen como HTML
# prerenderizado y Netlify las sirve directo. Todo lo demás (/app/…, /verificar,
# rutas viejas) abre el shell de la app y Vue Router decide.
[[redirects]]
  from = "/*"
  to = "/spa.html"
  status = 200

# PWA: el service worker y el manifest siempre se revisan (así la app detecta versiones nuevas)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
