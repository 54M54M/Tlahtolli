spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: System
    password: 8520
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format-sql: true

server:
  port: 7575

spring.mvc.cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"