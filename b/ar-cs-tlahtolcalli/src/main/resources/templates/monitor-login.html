<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Tlahtolcalli · Admin</title>
  <link rel="shortcut icon" href="https://dashboard.render.com/favicon-light.png">
  <!-- Instalable como app: manifest e íconos en /monitor/assets (públicos, ver MonitorPwaController) -->
  <link rel="manifest" href="/monitor/assets/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/monitor/assets/icon-192.png">
  <meta name="theme-color" content="#0e1517">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Monitor">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --jade: #00C896;
      --coral: #FF6B5B;
      --amber: #FFB547;
      --ink: #0B0D11;
      --card: #181C26;
      --border: #222636;
      --muted: #6B7390;
      --text: #D8DFF0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--ink);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
    }

    .brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--jade);
      margin-bottom: 6px;
    }

    h1 { font-size: 1.2rem; margin-bottom: 4px; }
    .sub { font-size: .8rem; color: var(--muted); margin-bottom: 20px; }

    label {
      display: block;
      font-size: .7rem;
      color: var(--muted);
      margin: 14px 0 6px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--ink);
      color: var(--text);
      font-size: .95rem;
    }

    input:focus { outline: 2px solid var(--jade); outline-offset: 1px; }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--jade);
      color: #04120d;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }

    .msg {
      font-size: .8rem;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      border: 1px solid;
    }

    .msg.err { color: var(--coral); border-color: rgba(255, 107, 91, .35); background: rgba(255, 107, 91, .08); }
    .msg.ok { color: var(--jade); border-color: rgba(0, 200, 150, .35); background: rgba(0, 200, 150, .08); }
    .msg.warn { color: var(--amber); border-color: rgba(255, 181, 71, .35); background: rgba(255, 181, 71, .08); }
  </style>
</head>

<body>
  <main class="card">
    <p class="brand">Tlahtolcalli</p>
    <h1>Monitor</h1>
    <p class="sub">Acceso solo para cuentas de administrador.</p>

    <p class="msg err" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
    <p class="msg warn" th:if="${param.denied}">Esta cuenta no tiene permiso para el monitor.</p>
    <p class="msg warn" th:if="${param.expired}">Tu sesión venció. Entra de nuevo.</p>
    <p class="msg ok" th:if="${param.logout}">Cerraste sesión.</p>

    <!-- th:action agrega el token CSRF automáticamente -->
    <form th:action="@{/monitor/login}" method="post">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>

</html>
